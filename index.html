<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/src/style.css" rel="stylesheet">
  <title>cnba</title>
</head>

<body class="flex flex-col h-screen">
  <header class="bg-red-700 text-white italic text-5xl text-center">
    CNBA
  </header>

  <main class="flex flex-1">
    <div class="flex-2 bg-blue-700">
      <button id="clicker" class="active:scale-95 transition-transform w-full h-full">
        <p id="display"></p>
        <img src="src/assets/Adobe Express - file (1).png" class="w-99 mx-auto" alt="basketball">
      </button>
    </div>

    <div class="bg-amber-500 flex-1">
      <h1 style="text-align: center;" class="text-5xl">Upgrade</h1>


      <hr>

      <div class="flex flex-wrap justify-center gap-6">
        <button
          class="flex transition-all text-white color bg-black items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl"
          id="upgradeOne">
          <img class="h-16 invert" src="/src/assets/Reff.png" alt="Reff">
          <p id="upgradeOneCount">0 Refs </p>
          <p id="">Cost:100 </p>
        </button>
        <button
          class="flex transition-all text-white color bg-black items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl"
          id="upgradeTwo">
          <img class="h-16 invert" src="/src/assets/Coach.jpg" alt="Coach">
          <p id="upgradeTwoCount">0 Coaches </p>
          <p id="">Cost:500 </p>
        </button>
        <button
          class="flex transition-all text-white color bg-black items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl"
          id="upgradeThree">
          <img class="h-16 invert" src="/src/assets/player .png" alt="Player">
          <p id="upgradeThreeCount">0 Players </p>
          <p id="">Cost:1000 </p>
        </button>
      </div>


    </div>





    <script type="module" src="/src/main.js"></script>
</body>

</html>
